name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 读取版本号
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 与 package.json 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "tag $TAG 与 package.json 的版本 $VERSION 不一致" >&2
            exit 1
          fi

      - name: 运行测试
        run: npm test

      - name: 生成升级包与清单
        run: |
          command -v zip >/dev/null || sudo apt-get update -qq && sudo apt-get install -y zip
          command -v rsync >/dev/null || sudo apt-get install -y rsync
          # 更新说明（「关于与更新」里给用户看的）：tag 附注写了内容就用它，否则用 tag 指向的那个提交的标题；
          # 这样从 main 手动重跑、或补发安装包时，说明不会变成最后一个 ci / chore 提交。
          VERSION="$(node -p "require('./package.json').version")"
          # actions/checkout 拉 tag 时会把附注 tag 变成轻量 tag，读不到附注；重新取一次真正的 tag。
          git fetch --force --tags origin >/dev/null 2>&1 || true
          NOTES="$(git log -1 --pretty=%s)"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            NOTES="$(git log -1 --pretty=%s "v$VERSION^{commit}")"
            TAG_NOTE="$(git tag -l --format='%(contents:subject)' "v$VERSION")"
            if [ -n "$TAG_NOTE" ] && [ "$TAG_NOTE" != "v$VERSION" ]; then NOTES="$TAG_NOTE"; fi
          fi
          JINGJING_UPDATE_NOTES="$NOTES" bash scripts/package-update.sh

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" \
              "dist/jingjing-app-$VERSION.zip" "dist/latest.json" "scripts/install.sh" "scripts/install.ps1" --clobber
          else
            gh release create "v$VERSION" \
              "dist/jingjing-app-$VERSION.zip" \
              "dist/latest.json" \
              "scripts/install.sh" \
              "scripts/install.ps1" \
              --title "v$VERSION" \
              --generate-notes
          fi

  # macOS App 只能在 macOS 上打（swiftc + pkgbuild），单独一个 job。
  # 用 macos-latest（Apple Silicon）：旧镜像会被 GitHub 下线（macos-14 已经不能用了）；
  # 最低系统版本由 build.sh 按 Info.plist 指定，和构建机是哪个 macOS 无关。
  macos-app:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 运行测试
        run: npm test

      - name: 构建 App / pkg / zip
        run: bash packaging/macos/build.sh

      - name: 生成 SHA256SUMS
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          cd dist
          shasum -a 256 "jingjing-$VERSION-macos-arm64.pkg" "jingjing-$VERSION-macos-arm64.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          gh release upload "v$VERSION" \
            "dist/jingjing-$VERSION-macos-arm64.pkg" \
            "dist/jingjing-$VERSION-macos-arm64.zip" \
            "dist/SHA256SUMS" \
            --clobber

  # Windows 桌面 App（托盘 + 原生窗口）：只能在 Windows 上打（.NET + Inno Setup），单独一个 job。
  windows-app:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 运行测试
        run: npm test

      - name: 构建 App / 安装包 / zip
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ needs.release.outputs.version }}'
          gh release upload "v$version" `
            "dist/jingjing-$version-windows-x64-setup.exe" `
            "dist/jingjing-$version-windows-x64.zip" `
            "dist/SHA256SUMS-windows.txt" `
            --clobber
