name: test

on:
  push:
    branches: ['**']
  pull_request:

# 同一分支连续推送时，只保留最新一次运行。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 和 npm test 一样，另外把失败的用例打成注解，在提交页面上直接能看到。
      - name: 运行测试
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/scripts/test-annotations.mjs --test-reporter-destination=stdout "tests/*.test.js"

      - name: 检查插件与内置 Worker 清单
        run: npm run plugin:check

      - name: 检查官方插件的构建产物是最新的
        run: npm run plugins:check-built

      - name: 检查升级包能正常打出
        run: |
          command -v zip >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zip)
          command -v rsync >/dev/null || sudo apt-get install -y rsync
          bash scripts/package-update.sh

      - name: 检查安装与打包脚本语法
        run: |
          bash -n scripts/install.sh
          bash -n scripts/install-service.sh
          bash -n scripts/uninstall-service.sh
          bash -n scripts/package-update.sh
          bash -n packaging/macos/build.sh

  # Windows：同一套测试，加上 PowerShell 脚本的语法检查、服务启动冒烟测试，以及 install.ps1 → 启动 → 常驻服务的端到端。
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 和 npm test 一样，另外把失败的用例打成注解，在提交页面上直接能看到。
      - name: 运行测试
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/scripts/test-annotations.mjs --test-reporter-destination=stdout "tests/*.test.js"

      - name: 检查插件与内置 Worker 清单
        run: npm run plugin:check

      - name: 检查官方插件的构建产物是最新的
        run: npm run plugins:check-built

      - name: 检查 PowerShell 脚本语法（Windows PowerShell 5.1）
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in @(Get-ChildItem scripts, .github/scripts -Filter *.ps1)) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: 服务启动冒烟测试
        shell: powershell
        run: |
          $env:JINGJING_DATA_DIR = Join-Path $env:RUNNER_TEMP 'jj-smoke'
          $env:JINGJING_HOST = '127.0.0.1'
          $env:JINGJING_PORT = '17777'
          $p = Start-Process node -ArgumentList 'server.js' -PassThru -NoNewWindow -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err.log
          $ok = $false
          for ($i = 0; $i -lt 40 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = [bool](Invoke-RestMethod http://127.0.0.1:17777/api/health -TimeoutSec 2).ok } catch { }
          }
          Stop-Process -Id $p.Id -Force
          Get-Content smoke.log, smoke.err.log
          if (-not $ok) { exit 1 }

      - name: install.ps1 与常驻服务端到端
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/windows-e2e.ps1
